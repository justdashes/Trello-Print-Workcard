<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Just Dashes Print Work Card</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <h1>Just Dashes Power-Up</h1>

  <script>
    var t = window.TrelloPowerUp.iframe();

    window.TrelloPowerUp.initialize({
      'card-buttons': function(t, options) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/159/159078.png',
          text: 'Print Work Card',
          callback: function(t) {
            return t.popup({
              title: 'Print Work Card',
              url: 'print.html',
              height: 200
            });
          }
        }];
      }
    });
  </script>
</body>
</html>

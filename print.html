<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Print Work Card</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Preview Work Card</h2>
  <p>The popup is working.</p>
  <button id="printBtn">Print</button>

  <script>
    var t = TrelloPowerUp.iframe();

    document.getElementById('printBtn').addEventListener('click', function () {
      window.print();
    });

    t.render(function () {
      return t.sizeTo('body');
    });
  </script>
</body>
</html>
